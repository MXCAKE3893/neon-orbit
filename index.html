<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>NEON ORBIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">ONE BUTTON SURVIVAL</p>
      <h1>NEON <em>ORBIT</em></h1>
      <div class="stats" aria-live="polite">
        <span>SCORE <b id="score">0000</b></span>
        <span>BEST <b id="best">0000</b></span>
      </div>
    </header>
    <section class="arena-wrap" aria-label="ゲーム画面">
      <canvas id="game" width="720" height="720"></canvas>
      <div class="overlay" id="overlay">
        <p class="status" id="status">TAP TO LAUNCH</p>
        <p class="instruction" id="instruction">クリック / タップ / SPACE で軌道を切り替え</p>
      </div>
    </section>
    <footer><span>SWITCH THE ORBIT</span><span>DON'T TOUCH THE STATIC</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
